# Local services. Port 5433: a PostgreSQL already running on this machine keeps 5432.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: figtest
      POSTGRES_PASSWORD: figtest
      POSTGRES_DB: figtest
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U figtest -d figtest"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
